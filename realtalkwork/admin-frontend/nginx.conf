server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    set $api_backend "http://api:8000";

    # Proxy API requests to backend (eliminates CORS for admin login)
    location ~ ^/(api|admin|payment|auth|health|ready|billing|transcript|learning|scenario|roleplay|practice|training|apple)/ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_request_body on;
        proxy_pass_request_headers on;
        # Allow cookies through
        proxy_cookie_path / /;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback: serve index.html for all non-file paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
