# RealTalk API 部署（3 副本 + Redis 主从）
#
# 环境变量来自两个资源：
#   - realtalk-api-secret：数据库连接串、JWT 密钥、AI/微信/支付密钥
#   - realtalk-api-config：区域、功能开关等非敏感配置
#
# REDIS_URL 指向 redis-master Service（只有 Master 接受写入）。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtalk-api
  labels:
    app: realtalk-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: realtalk-api
  template:
    metadata:
      labels:
        app: realtalk-api
    spec:
      containers:
        - name: api
          image: your-registry/realtalk-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: realtalk-api-secret
            - configMapRef:
                name: realtalk-api-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: realtalk-api
spec:
  selector:
    app: realtalk-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
