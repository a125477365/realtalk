# 单 Pod 本地语音模型服务器：REST + speech-to-speech Realtime，统一 Qwen3-TTS 音色。
# GPU：镜像构建 --build-arg DEVICE=cuda，并解开 resources.limits 的 nvidia.com/gpu 注释。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speech-models
spec:
  accessModes: ["ReadWriteOnce"]   # 多副本共享请改 ReadWriteMany（需支持的 StorageClass）
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtalk-speech
spec:
  replicas: 1
  selector:
    matchLabels: { app: realtalk-speech }
  template:
    metadata:
      labels: { app: realtalk-speech }
    spec:
      containers:
        - name: speech
          image: realtalk-speech:latest   # 用 speechserver/Dockerfile 构建并推到你的镜像仓库
          ports: [{ containerPort: 9100 }]
          env:
            - { name: SPEECH_DEVICE, value: "cpu" }
            - { name: SPEECH_ASR_MODEL, value: "small" }
            - { name: SPEECH_LLM_REPO, value: "Qwen/Qwen2.5-1.5B-Instruct-GGUF" }
            - { name: SPEECH_LLM_FILE, value: "qwen2.5-1.5b-instruct-q4_k_m.gguf" }
            # llama.cpp 进程内单实例非线程安全：并发>1 崩 pod。高并发用 SPEECH_LLM_BASE_URL 代理外部 llama-server，
            # 或多副本(replicas)横向扩展——不要调大这个值。
            - { name: SPEECH_LLM_CONCURRENCY, value: "1" }
            - { name: SPEECH_REALTIME_ENGINE, value: "s2s" }
            - { name: SPEECH_S2S_REALTIME_URL, value: "ws://127.0.0.1:8765/v1/realtime" }
            - { name: SPEECH_S2S_LLM_BASE_URL, value: "http://127.0.0.1:9100/v1" }
            - { name: SPEECH_TTS_MODEL, value: "Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice" }
            - { name: SPEECH_TTS_SPEAKER, value: "Aiden" }
            - { name: SPEECH_TTS_QUANT, value: "Q4_K_M" }
            - { name: HF_HOME, value: "/models/huggingface" }
            - { name: HF_ENDPOINT, value: "" }        # 受限网络填 https://hf-mirror.com
            - { name: REDIS_URL, value: "redis://realtalk-redis:6379/1" }   # 多活实时上下文
          volumeMounts:
            - { name: models, mountPath: /models }
          # 首次启动要下载 Whisper/GGUF/Qwen3-TTS → startupProbe 给足时间
          startupProbe:
            httpGet: { path: /health, port: 9100 }
            periodSeconds: 15
            failureThreshold: 80   # 最长 20 分钟
          readinessProbe:
            httpGet: { path: /health, port: 9100 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9100 }
            periodSeconds: 30
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits:
              cpu: "4"
              memory: 8Gi
              # nvidia.com/gpu: 1
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: speech-models }
---
apiVersion: v1
kind: Service
metadata:
  name: realtalk-speech
spec:
  selector: { app: realtalk-speech }
  ports:
    - port: 9100
      targetPort: 9100
