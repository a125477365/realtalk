services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: realtalk
      POSTGRES_PASSWORD: realtalk
      POSTGRES_DB: realtalk
    volumes:
      - /mnt/data_md0/DB/realtalk:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realtalk"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://realtalk:realtalk@postgres:5432/realtalk?sslmode=disable"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin-frontend:
    build:
      context: .
      dockerfile: admin-frontend/Dockerfile
    env_file:
      - .env
    ports:
      - "8001:80"
    restart: unless-stopped
