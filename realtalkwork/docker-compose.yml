services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-realtalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realtalk}
      POSTGRES_DB: ${POSTGRES_DB:-realtalk}
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-realtalk}"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-realtalk}:${POSTGRES_PASSWORD:-realtalk}@postgres:5432/${POSTGRES_DB:-realtalk}?sslmode=disable"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin-frontend:
    build:
      context: .
      dockerfile: admin-frontend/Dockerfile
    env_file:
      - .env
    ports:
      - "${ADMIN_PORT:-8001}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
