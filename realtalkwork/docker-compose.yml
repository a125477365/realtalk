# RealTalk 容器编排：按 profile 选择部署哪些应用（支持分布式拆机部署）
#
#   backend       后端 API（DATABASE_URL 留空时连内置 postgres）
#   backend-db    内置 PostgreSQL（使用外部数据库时不要启用）
#   backend-redis 内置 Redis（采集分块暂存；用远程 Redis 时不要启用）
#   admin         管理台
#   web           用户 Web 端
#
# 用法（推荐通过 bash setup.sh 交互式生成 .env 与 COMPOSE_PROFILES）：
#   COMPOSE_PROFILES=backend,backend-db,admin,web docker compose up -d --build
#   # 仅在另一台机器部署管理台（API 在别处）：
#   COMPOSE_PROFILES=admin API_UPSTREAM=http://10.0.0.5:8000 docker compose up -d --build

services:
  postgres:
    profiles: ["backend-db"]
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-realtalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-realtalk}
      POSTGRES_DB: ${POSTGRES_DB:-realtalk}
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    ports:
      # 对外映射默认不用 5432（避免与宿主机已有 PostgreSQL 冲突）；供拆机部署时远程后端连接，勿暴露公网
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-realtalk}"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    profiles: ["backend-redis"]
    image: redis:7-alpine
    # 采集分块只是短命数据（带 TTL、用完即删），开 appendonly 仅为重启不丢正在进行的上传
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - ${REDIS_DATA_DIR:-./data/redis}:/data
    ports:
      # 对外映射不使用默认 6379，避免与宿主机已有 Redis 冲突；setup.sh 会写入 REDIS_PORT
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["backend"]
    build:
      context: .
    env_file:
      - .env
    environment:
      # 由 .env 提供完整 DATABASE_URL（setup.sh 会写入，含内置库密码）；
      # 手动运行且未设置时，用与内置 postgres 默认账号一致的连接串兜底。
      # 注意：compose 插值不支持嵌套 ${}，默认值必须是字面量。
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://realtalk:realtalk@postgres:5432/realtalk?sslmode=disable}"
      # 采集分块暂存：留空=本地文件兜底；内置 Redis 时 setup.sh 写为 redis://redis:6379/0
      REDIS_URL: "${REDIS_URL:-}"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ${UPLOAD_DATA_DIR:-./data/uploads}:/app/uploads
      - ${WHISPER_MODEL_DIR:-./data/whisper-models}:/app/models
    # 不用 depends_on：内置库场景 postgres 同时启动，外部库场景 postgres 服务不存在。
    # API 若先于数据库就绪而退出，靠 restart 策略自动重连（postgres 有健康检查）。
    restart: unless-stopped

  admin-frontend:
    profiles: ["admin"]
    build:
      context: .
      dockerfile: admin-frontend/Dockerfile
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://api:8000}
    ports:
      - "${ADMIN_PORT:-8001}:80"
    restart: unless-stopped

  web-frontend:
    profiles: ["web"]
    build:
      context: .
      dockerfile: web-frontend/Dockerfile
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://api:8000}
    ports:
      - "${WEB_PORT:-8002}:80"
    restart: unless-stopped

# 容器间使用独立私网；对外访问仍只经过上面的 ports 映射到宿主机。
# 若与 VPN/现有局域网冲突，可在 .env 覆盖 COMPOSE_SUBNET。
networks:
  default:
    name: ${COMPOSE_NETWORK_NAME:-realtalk}
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.28.0.0/16}
