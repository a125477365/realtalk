# 本地实时语音模型服务器（可选组件，setup.sh 菜单 4 选装，profile=speech）：
#   docker compose -f docker-compose.yml -f docker-compose.speech.yml up -d --build
# 与 api 同一网络；实时上下文存 Redis（SPEECH_REDIS_URL：同机内置或远程均可，多活/多副本安全）。
# GPU 部署：把 build.args.DEVICE 改为 cuda，并解开 deploy.resources 注释（需 nvidia-container-toolkit）。
services:
  speech:
    profiles: ["speech"]
    build:
      context: ./speechserver
      args:
        DEVICE: ${SPEECH_DEVICE:-cpu}
    restart: unless-stopped
    ports:
      - "${SPEECH_PORT:-9100}:9100"
    environment:
      SPEECH_DEVICE: ${SPEECH_DEVICE:-cpu}
      SPEECH_ASR_MODEL: ${SPEECH_ASR_MODEL:-small}
      SPEECH_LLM_REPO: ${SPEECH_LLM_REPO:-Qwen/Qwen2.5-1.5B-Instruct-GGUF}
      SPEECH_LLM_FILE: ${SPEECH_LLM_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      SPEECH_TTS_VOICE_EN: ${SPEECH_TTS_VOICE_EN:-en_US-lessac-medium}
      SPEECH_TTS_VOICE_ZH: ${SPEECH_TTS_VOICE_ZH:-zh_CN-huayan-medium}
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      PIPER_VOICES_BASE: ${PIPER_VOICES_BASE:-}
      # 实时上下文 Redis：同机内置(菜单5)=redis://redis:6379/1；拆机部署由 setup.sh 写入远程地址。
      # 不用 depends_on：远程 Redis 场景本机 redis 服务不存在；连不上时靠 restart 策略自动重连。
      REDIS_URL: ${SPEECH_REDIS_URL:-redis://redis:6379/1}
    volumes:
      - ${SPEECH_MODELS_DIR:-./speech-models}:/models
