# 本地语音模型服务（可选组件，setup.sh 菜单 4 选装；聚合器 profile=speech，原生实时 profile=speech-s2s）：
#   docker compose -f docker-compose.yml -f docker-compose.speech.yml up -d --build
# 与 api 同一网络；默认 s2s 实时模式由 API 后端断线后从数据库重新播种上下文。
# 只有 SPEECH_REALTIME_ENGINE=legacy 时才使用 SPEECH_REDIS_URL 保存短期实时上下文。
# GPU 部署：把 build.args.DEVICE 改为 cuda，并解开 deploy.resources 注释（需 nvidia-container-toolkit）。
services:
  speech:
    profiles: ["speech"]
    build:
      context: ./speechserver
      args:
        DEVICE: ${SPEECH_DEVICE:-cpu}
        # true=源码构建兼容旧 CPU（无 AVX2/FMA 也可运行）；新 CPU 想缩短构建时间可显式改 false。
        LLAMA_CPU_PORTABLE: ${SPEECH_LLAMA_CPU_PORTABLE:-true}
    restart: unless-stopped
    ports:
      - "${SPEECH_PORT:-9100}:9100"
    environment:
      SPEECH_DEVICE: ${SPEECH_DEVICE:-cpu}
      SPEECH_ASR_MODEL: ${SPEECH_ASR_MODEL:-small}
      SPEECH_LLM_REPO: ${SPEECH_LLM_REPO:-Qwen/Qwen2.5-1.5B-Instruct-GGUF}
      SPEECH_LLM_FILE: ${SPEECH_LLM_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
      # llama.cpp 进程内单实例非线程安全：并发>1 会崩容器。要更高并发用 SPEECH_LLM_BASE_URL
      # 代理外部 llama-server（多实例/连续批处理），不要调大这里。
      SPEECH_LLM_CONCURRENCY: ${SPEECH_LLM_CONCURRENCY:-1}
      # 9100 仍是唯一对外地址：REST 由本容器处理；WS /realtime 默认转给下方
      # speech-to-speech 原生编排器。设 legacy 可紧急回退到旧 realtime.py。
      SPEECH_REALTIME_ENGINE: ${SPEECH_REALTIME_ENGINE:-s2s}
      SPEECH_S2S_REALTIME_URL: ${SPEECH_S2S_REALTIME_URL:-ws://speech-s2s:8765/v1/realtime}
      SPEECH_S2S_COMMIT_SILENCE_MS: ${SPEECH_S2S_COMMIT_SILENCE_MS:-750}
      SPEECH_TTS_VOICE_EN: ${SPEECH_TTS_VOICE_EN:-en_US-lessac-medium}
      SPEECH_TTS_VOICE_ZH: ${SPEECH_TTS_VOICE_ZH:-zh_CN-huayan-medium}
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub
      PIPER_VOICES_BASE: ${PIPER_VOICES_BASE:-}
      # legacy 模式实时上下文 Redis；s2s 模式不会读取它。
      REDIS_URL: ${SPEECH_REDIS_URL:-redis://redis:6379/1}
    volumes:
      - ${SPEECH_MODELS_DIR:-./speech-models}:/models
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # 只供 speech 聚合器访问，不暴露宿主端口。它原生负责 /v1/realtime 的 VAD→ASR→
  # LLM→Qwen TTS 流水线；LLM 回调 speech:9100，因此同一个 GGUF 同时服务 REST 和实时。
  speech-s2s:
    # 与聚合器分开 profile：SPEECH_REALTIME_ENGINE=legacy 时无需下载/常驻 Qwen3-TTS。
    profiles: ["speech-s2s"]
    build:
      context: ./speechserver
      dockerfile: Dockerfile.s2s
    restart: unless-stopped
    depends_on:
      speech:
        condition: service_healthy
    environment:
      SPEECH_DEVICE: ${SPEECH_DEVICE:-cpu}
      SPEECH_ASR_MODEL: ${SPEECH_ASR_MODEL:-small}
      SPEECH_S2S_PIPELINES: ${SPEECH_S2S_PIPELINES:-1}
      SPEECH_S2S_ASR_COMPUTE_TYPE: ${SPEECH_S2S_ASR_COMPUTE_TYPE:-int8}
      SPEECH_S2S_ASR_LANGUAGE: ${SPEECH_S2S_ASR_LANGUAGE:-auto}
      SPEECH_S2S_LLM_BASE_URL: ${SPEECH_S2S_LLM_BASE_URL:-http://speech:9100/v1}
      SPEECH_S2S_LLM_MODEL: ${SPEECH_S2S_LLM_MODEL:-local}
      SPEECH_S2S_LLM_API_KEY: ${SPEECH_S2S_LLM_API_KEY:-local}
      # CPU 默认 0.6B CustomVoice，质量/流畅度优先时改为 1.7B；不需要 CUDA。
      SPEECH_S2S_TTS_MODEL: ${SPEECH_S2S_TTS_MODEL:-Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice}
      SPEECH_S2S_TTS_DTYPE: ${SPEECH_S2S_TTS_DTYPE:-float32}
      SPEECH_S2S_TTS_BACKEND: ${SPEECH_S2S_TTS_BACKEND:-ggml}
      SPEECH_S2S_TTS_SPEAKER: ${SPEECH_S2S_TTS_SPEAKER:-Aiden}
      SPEECH_S2S_TTS_LANGUAGE: ${SPEECH_S2S_TTS_LANGUAGE:-auto}
      SPEECH_S2S_MIN_SILENCE_MS: ${SPEECH_S2S_MIN_SILENCE_MS:-500}
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      # Qwen3-TTS 也写入与 Whisper/GGUF/Piper 相同的宿主机模型卷，重建容器无需重下。
      HF_HOME: /models/huggingface
      HUGGINGFACE_HUB_CACHE: /models/huggingface/hub
    volumes:
      - ${SPEECH_MODELS_DIR:-./speech-models}:/models
