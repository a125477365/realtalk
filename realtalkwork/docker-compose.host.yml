# RealTalk · 宿主机网络模式（host networking）覆盖层
# =============================================================================
# 什么时候用：部署在软路由 / OpenWrt(iStoreOS) 之类会 REJECT「docker 区域 → lan 区域」
# 转发的环境里，容器需要直接访问局域网其它主机（典型：局域网里的语音服务器）。
# 这类系统默认只放行 docker→wan（能上外网），却拦 docker→lan（到不了同网段设备），
# 表现就是容器里 curl 局域网 IP 瞬时 “All connection attempts failed”，而宿主机自己却通。
# host 模式让容器与宿主共用网络栈，出局域网不再经「转发」链，因此天然绕过该限制。
#
# 职责边界（单一决策点原则）：
#   本文件只管两件事——network_mode: host + 各服务直接绑定原对外端口：
#     postgres 5433 / redis 6380 / api 8000 / speech 9100 / admin 8001 / web 8002
#   （redis 用 6380、pg 用 5433 而非默认端口，避开宿主可能已有的同类服务。）
#   服务之间「连谁、连哪个地址」不归它管——那由 setup.sh 在生成 .env 时一次性决定：
#     本机服务 → 127.0.0.1:对外端口（host 模式没有容器 DNS，服务名不可用）
#     远程服务 → 真实 IP/域名（与 bridge 模式写法相同，不受网络模式影响）
#   即 DATABASE_URL / REDIS_URL / SPEECH_REDIS_URL / API_UPSTREAM 全部原样取自 .env，
#   本文件一律不改写。手动维护 .env 时按 .env.example 中 host 模式示例填写即可。
#
# 启用方式：运行 bash setup.sh 在「网络模式」一步选 host（会自动写入下面两行并按
# host 形态生成全部连接串）；或手动在 .env 加：
#   COMPOSE_FILE=docker-compose.yml:docker-compose.host.yml
#   COMPOSE_PATH_SEPARATOR=:
# 之后照常 docker compose up -d --build（无需 -f）。
#
# 说明：host 模式下 docker 会忽略各服务保留的 ports 映射，`up` 时打印一行
# “Published ports are discarded when using host network mode” 属正常提示，可忽略
# （之所以不删 ports，是为兼容旧版 compose——删除需 !reset，依赖 compose ≥ v2.24）。
# =============================================================================

services:
  postgres:
    network_mode: host
    # host 模式忽略端口映射；用 -p 让 postgres 直接监听对外端口（默认 5433，避开宿主 5432）
    command: ["-p", "${POSTGRES_PORT:-5433}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-realtalk} -p ${POSTGRES_PORT:-5433}"]

  redis:
    network_mode: host
    # 直接监听 6380（默认值即当前对外端口），其余保持原有 appendonly 配置
    command: ["redis-server", "--port", "${REDIS_PORT:-6380}", "--appendonly", "yes", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6380}", "ping"]

  api:
    network_mode: host
    environment:
      # 让 uvicorn 直接绑定对外端口（bridge 模式下此变量不设→仍是容器内 8000，经端口映射对外）
      API_BIND_PORT: "${API_PORT:-8000}"

  speech:
    network_mode: host
    environment:
      # server.py 按 SPEECH_PORT 绑定端口（bridge 下不传→容器内固定 9100，经端口映射对外）
      SPEECH_PORT: "${SPEECH_PORT:-9100}"

  admin-frontend:
    network_mode: host
    environment:
      NGINX_PORT: "${ADMIN_PORT:-8001}"   # nginx 直接监听 8001（host 模式没有 80→8001 的映射）

  web-frontend:
    network_mode: host
    environment:
      NGINX_PORT: "${WEB_PORT:-8002}"
