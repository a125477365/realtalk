# RealTalk · 宿主机网络模式（host networking）覆盖层
# =============================================================================
# 什么时候用：部署在软路由 / OpenWrt(iStoreOS) 之类会 REJECT「docker 区域 → lan 区域」
# 转发的环境里，容器需要直接访问局域网其它主机（典型：本机语音服务器 Mac 192.168.6.90）。
# 这类系统默认只放行 docker→wan（能上外网），却拦 docker→lan（到不了同网段设备），
# 表现就是容器里 curl 局域网 IP 瞬时 “All connection attempts failed”，而宿主机自己却通。
# host 模式让容器与宿主共用网络栈，出局域网不再经「转发」链，因此天然绕过该限制。
#
# host 模式的两个副作用，本文件已逐一处理：
#   1) 没有端口映射（ports 被忽略）——各服务「直接绑定」宿主端口，绑的就是原来的对外端口：
#        postgres 5433 / redis 6380 / api 8000 / speech 9100 / admin 8001 / web 8002
#      （redis 特意用 6380 而非默认 6379，避开宿主可能已有的 Redis。）
#   2) 没有容器 DNS（postgres/redis/api 这些服务名不可用）——服务之间一律改用 127.0.0.1。
#      DATABASE_URL / REDIS_URL / API_UPSTREAM 由 .env 里的账号密码 + 端口「零件」重新拼成
#      127.0.0.1 版本，覆盖 .env 里那份 bridge 版（environment 优先级高于 env_file），
#      所以切 host 模式不用改 .env。
#
# 用法（在 docker-compose.yml 之外再叠加本文件即可）：
#   COMPOSE_PROFILES=backend,backend-db,backend-redis,speech,admin,web \
#     docker compose -f docker-compose.yml -f docker-compose.host.yml up -d --build
#   # 也可写进 .env：COMPOSE_FILE=docker-compose.yml:docker-compose.host.yml
#   #                COMPOSE_PATH_SEPARATOR=:   之后照常 docker compose up -d 即可。
#
# 前提：本文件假设用「内置」postgres/redis（backend-db / backend-redis profile）。
# 若用外部数据库/Redis，请勿用它改写 DATABASE_URL/REDIS_URL——把 .env 里的连接串直接
# 写成可达的 IP:端口即可（外部服务本就走 IP，不受 host/bridge 影响）。
#
# 说明：host 模式下 docker 会忽略下方各服务保留的 ports 映射，`up` 时打印一行
# “Published ports are discarded when using host network mode” 属正常提示，可忽略
# （之所以不删 ports，是为兼容旧版 compose——删除需 !reset，依赖 compose ≥ v2.24）。
# =============================================================================

services:
  postgres:
    network_mode: host
    # host 模式忽略端口映射；用 -p 让 postgres 直接监听对外端口（默认 5433，避开宿主 5432）
    command: ["-p", "${POSTGRES_PORT:-5433}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-realtalk} -p ${POSTGRES_PORT:-5433}"]

  redis:
    network_mode: host
    # 直接监听 6380（默认值即当前对外端口），其余保持原有 appendonly 配置
    command: ["redis-server", "--port", "${REDIS_PORT:-6380}", "--appendonly", "yes", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6380}", "ping"]

  api:
    network_mode: host
    environment:
      # 服务名 → 127.0.0.1；账号密码/库名/端口沿用 .env 里 setup.sh 写好的零件
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-realtalk}:${POSTGRES_PASSWORD:-realtalk}@127.0.0.1:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-realtalk}?sslmode=disable"
      REDIS_URL: "redis://127.0.0.1:${REDIS_PORT:-6380}/0"
      # 让 uvicorn 直接绑定对外端口（bridge 模式下此变量不设→仍是容器内 8000，经端口映射对外）
      API_BIND_PORT: "${API_PORT:-8000}"

  speech:
    network_mode: host
    environment:
      # speech 容器用 REDIS_URL 这个键存实时上下文（bridge 版是 SPEECH_REDIS_URL→redis:6379/1）
      REDIS_URL: "redis://127.0.0.1:${REDIS_PORT:-6380}/1"

  admin-frontend:
    network_mode: host
    environment:
      API_UPSTREAM: "http://127.0.0.1:${API_PORT:-8000}"
      NGINX_PORT: "${ADMIN_PORT:-8001}"   # nginx 直接监听 8001（host 模式没有 80→8001 的映射）

  web-frontend:
    network_mode: host
    environment:
      API_UPSTREAM: "http://127.0.0.1:${API_PORT:-8000}"
      NGINX_PORT: "${WEB_PORT:-8002}"
